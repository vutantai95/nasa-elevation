<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elevation Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root,[data-theme="dark"]{
  --bg:#08090c;--s1:#101318;--s2:#181c23;--s3:rgba(16,19,24,0.85);
  --bd:rgba(255,255,255,.07);--bdh:rgba(255,255,255,.14);
  --ac:#3dffa0;--ac2:#38b6ff;--red:#ff4d6d;--warn:#ffb347;
  --txt:#dde4f0;--m:#68748c;--m2:#2e3548;
  --shadow:rgba(0,0,0,.5);
  --r:12px;--rs:7px;
}

[data-theme="light"]{
  --bg:#f0f2f7;--s1:#ffffff;--s2:#f5f7fb;--s3:rgba(255,255,255,0.85);
  --bd:rgba(0,0,0,.08);--bdh:rgba(0,0,0,.15);
  --ac:#0a9e5c;--ac2:#0078cc;--red:#d63251;--warn:#e08400;
  --txt:#1a2035;--m:#8a96ae;--m2:#c8d0e0;
  --shadow:rgba(0,0,0,.15);
  --r:12px;--rs:7px;
}

html, body {
  width: 100vw; height: 100vh; 
  overflow: hidden; 
  background: var(--bg); color: var(--txt);
  font-family: 'DM Sans', sans-serif; font-size: 14px;
  transition: background .25s, color .25s;
}

.map-wrap { position: relative; width: 100%; height: 100%; }
#map { width: 100%; height: 100%; z-index: 1; }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: var(--m); border-radius: 4px; }

.floating-panel {
  background: var(--s3); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--bd); border-radius: 8px;
  box-shadow: 0 4px 16px var(--shadow);
}

/* 1. Search Area (Top Left) */
.top-search-area { position: absolute; z-index: 1000; top: 10px; left: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; align-items: flex-start; }
.top-search-area > * { pointer-events: auto; }
.search-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; pointer-events: none; }
.search-row > * { pointer-events: auto; }
.search-wrap { flex: 0 1 auto; min-width: 0; position: relative; display: flex; align-items: center; z-index: 1100; }
.map-search { display: flex; align-items: center; padding: 0; height: 36px; }
.map-search-input { flex: 1; height: 34px; background: transparent; border: none; padding: 0 6px 0 10px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--txt); outline: none; width: 230px; min-width: 0; }
.map-search-input::placeholder { color: var(--m2); }
.map-search-actions { display: flex; align-items: center; border-left: 1px solid var(--bd); height: 34px; }
.map-search-btn { width: 30px; height: 34px; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--m); transition: color .15s; flex-shrink: 0; }
.map-search-btn:hover { color: var(--ac); }
.map-search-btn.clear-btn { color: var(--m); }
.map-search-btn.clear-btn:hover { color: var(--red); }
.map-search-btn svg { width: 13px; height: 13px; pointer-events: none; }
.map-search-btn.search-btn svg { width: 14px; height: 14px; }
.map-search-btn.search-btn { color: var(--ac); border-radius: 0 8px 8px 0; }
.map-search-btn.search-btn:hover { color: var(--txt); }
.btn-sep { width: 1px; height: 16px; background: var(--bd); flex-shrink: 0; margin: 0 1px; }

.icon-btn { width: 36px; height: 36px; border: 1px solid var(--bd); background: var(--s3); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--m); border-radius: 8px; transition: all .15s; }
.icon-btn:hover { color: var(--ac); background: var(--s2); border-color: var(--bdh); }
.icon-btn svg { width: 16px; height: 16px; pointer-events: none; }
#mapGpsBtn:hover { color: var(--ac2); }
#mapGpsBtn.locating svg { animation: spin .8s linear infinite; }

/* 2. Location Presets */
.map-presets { position: static; z-index: 999; display: flex; gap: 4px; padding: 4px; width: auto; max-width: 100%; overflow-x: auto; pointer-events: all; flex: 0 0 auto; align-self: flex-start; }
.pre-btn { padding: 4px 10px; border-radius: 6px; border: 1px solid transparent; background: transparent; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 11.5px; font-weight: 500; color: var(--txt); transition: all .14s; white-space: nowrap; }
.pre-btn:hover { background: var(--s2); color: var(--ac); border-color: var(--bd); }

/* 3. Map Layers (Top Right) */
.map-layer-btns { position: absolute; z-index: 1000; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 4px; padding: 4px; pointer-events: all; }
.layer-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid transparent; background: transparent; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 11.5px; font-weight: 600; color: var(--m); transition: all .15s; text-align: left; }
.layer-btn:hover { color: var(--txt); background: var(--s2); }
.layer-btn.active { background: var(--s2); border-color: var(--bd); color: var(--ac); }
.layer-btn.label-btn { border-top: 1px solid var(--bd); border-radius: 0 0 6px 6px; margin-top: 2px; }
.layer-btn.label-btn.on { color: var(--ac); }
.label-tile-invert { filter: invert(1) brightness(2) drop-shadow(0px 0px 2px rgba(0,0,0,.95)) drop-shadow(0px 0px 2px rgba(0,0,0,.8)); }

/* 4. Configuration Panel (Bottom Right) */
.map-config { position: absolute; z-index: 1000; bottom: 20px; right: 60px; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; pointer-events: all; }
.cfg-row { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.cfg-label { font-family: 'Syne', sans-serif; font-size: 9px; font-weight: 700; color: var(--m); text-transform: uppercase; letter-spacing: .5px; min-width: 48px; }
.cfg-pills { display: flex; gap: 4px; flex: 1; }
.cfg-pill { padding: 4px 8px; border-radius: 4px; border: 1px solid var(--bd); background: transparent; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 10.5px; font-weight: 500; color: var(--m); transition: all .14s; }
.cfg-pill:hover { color: var(--txt); border-color: var(--bdh); }
.cfg-pill.active { background: rgba(61,255,160,.1); border-color: var(--ac); color: var(--ac); }
[data-theme="light"] .cfg-pill.active { background: rgba(10,158,92,.1); border-color: var(--ac); }
.cfg-pill.ds.active { background: rgba(56,182,255,.1); border-color: var(--ac2); color: var(--ac2); }

/* Theme & Lang Buttons */
.cfg-divider { width: 1px; height: 18px; background: var(--bd); margin: 0 2px; }
.mini-btn-group { display: flex; gap: 4px; }
.theme-btn-mini { width: 26px; height: 26px; border-radius: 4px; border: 1px solid var(--bd); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--m); transition: all .15s; }
.theme-btn-mini:hover { color: var(--ac); background: var(--s2); border-color: var(--ac); }
.theme-btn-mini svg { width: 13px; height: 13px; pointer-events: none; }
.lang-btn { font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 700; }
[data-theme="light"] .icon-moon{display:none}
[data-theme="light"] .icon-sun{display:block!important}
[data-theme="dark"] .icon-sun{display:none}
[data-theme="dark"] .icon-moon{display:block!important}

/* 5. Elevation Badge (Bottom Left) */
.map-elev-badge { position: absolute; z-index: 1000; bottom: 20px; left: 10px; padding: 12px 16px 10px; width: 260px; opacity: 0; transform: translateY(6px); transition: opacity .35s, transform .35s; pointer-events: none; }
.map-elev-badge.show { opacity: 1; transform: translateY(0); pointer-events: all; }
.meb-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.meb-numblock { display: flex; align-items: baseline; gap: 3px; flex-shrink: 0; }
.meb-num { font-family: 'DM Sans', sans-serif; font-size: 38px; font-weight: 700; color: var(--ac); letter-spacing: -1.5px; line-height: 1; transition: color .3s; }
.meb-unit { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: var(--m); padding-bottom: 2px; }
.meb-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.meb-label { font-family: 'Syne', sans-serif; font-size: 8px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--m); white-space: nowrap; }
.meb-loc { font-family: 'DM Sans', sans-serif; font-size: 11.5px; font-weight: 500; color: var(--txt); line-height: 1.4; word-wrap: break-word; }
.meb-divider { height: 1px; background: var(--bd); margin-bottom: 8px; }
.meb-terrain { display: flex; flex-direction: column; gap: 5px; }
.meb-terrain-label { font-family: 'Syne', sans-serif; font-size: 8px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--m); display: flex; justify-content: space-between; }
.meb-track { height: 6px; border-radius: 4px; background: linear-gradient(90deg, #1a6fff 0%, #00b4ff 12%, #00e676 25%, #76ff03 38%, #ffea00 52%, #ff9100 66%, #ff3d00 80%, #b71c1c 92%, #f5f5f5 100%); position: relative; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
.meb-thumb { position: absolute; top: 50%; left: 0; transform: translate(-50%,-50%); width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid var(--bg); box-shadow: 0 0 0 2px var(--ac), 0 2px 6px rgba(0,0,0,.5); transition: left 1s cubic-bezier(.34,1.56,.64,1),box-shadow .3s; }
.meb-ticks { display: flex; justify-content: space-between; font-size: 8.5px; font-family: 'JetBrains Mono', monospace; color: var(--m2); margin-top: 1px; }
@keyframes spin { to { transform: rotate(360deg) } }
.meb-spin { width: 10px; height: 10px; border: 1.5px solid rgba(61,255,160,.2); border-top-color: var(--ac); border-radius: 50%; animation: spin .7s linear infinite; position: absolute; top: 10px; right: 12px; opacity: 0; transition: opacity .2s; }
.map-elev-badge.loading .meb-spin { opacity: 1; }

/* 6. Zoom Controls (Bottom Right) - Cao ngang bảng Config */
.map-zoom-cluster { position: absolute; z-index: 1000; bottom: 20px; right: 10px; display: flex; flex-direction: column; padding: 0; pointer-events: all; }
.map-zoom-btn { width: 36px; height: 40px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--m); font-size: 18px; font-weight: 400; transition: all .15s; }
.map-zoom-btn:hover { color: var(--txt); background: var(--s2); }
.map-zoom-btn:first-child { border-bottom: 1px solid var(--bd); border-radius: 8px 8px 0 0; }
.map-zoom-btn:last-child { border-radius: 0 0 8px 8px; }

/* Autocomplete Dropdown */
.ac-dropdown {
  position: absolute; top: calc(100% + 6px); left: 0;
  min-width: 280px; max-width: 420px; width: max-content;
  background: var(--s1); border: 1px solid var(--bdh);
  border-radius: var(--r); box-shadow: 0 8px 32px var(--shadow);
  overflow: hidden; z-index: 1200;
  display: none; flex-direction: column;
  max-height: 280px; overflow-y: auto;
}
.ac-dropdown.open { display: flex; }
.ac-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 9px 12px; cursor: pointer;
  border-bottom: 1px solid var(--bd);
  transition: background .12s;
}
.ac-item:last-child { border-bottom: none; }
.ac-item:hover, .ac-item.focused { background: var(--s2); }
.ac-icon { flex-shrink: 0; margin-top: 2px; color: var(--ac); }
.ac-icon svg { width: 13px; height: 13px; }
.ac-text { flex: 1; min-width: 0; }
.ac-name { font-family: 'DM Sans', sans-serif; font-size: 12.5px; font-weight: 600; color: var(--txt); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ac-sub { font-family: 'DM Sans', sans-serif; font-size: 10.5px; color: var(--m); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ac-type { flex-shrink: 0; font-family: 'Syne', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--m2); background: var(--s2); border: 1px solid var(--bd); border-radius: 4px; padding: 2px 5px; margin-top: 2px; align-self: flex-start; }
.ac-loading { padding: 12px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--m); display: flex; align-items: center; justify-content: center; gap: 8px; }
.ac-loading-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ac); animation: acPulse .9s ease-in-out infinite; }
.ac-loading-dot:nth-child(2) { animation-delay: .15s; }
.ac-loading-dot:nth-child(3) { animation-delay: .3s; }
@keyframes acPulse { 0%,80%,100%{transform:scale(.6);opacity:.4} 40%{transform:scale(1);opacity:1} }
.ac-empty { padding: 12px; text-align: center; font-size: 11.5px; color: var(--m); font-family: 'DM Sans', sans-serif; }

.toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(8px); padding: 8px 18px; background: var(--s2); border: 1px solid rgba(61,255,160,.3); border-radius: 20px; font-size: 12px; color: var(--ac); font-family: 'JetBrains Mono', monospace; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 9999; white-space: nowrap; box-shadow: 0 4px 12px var(--shadow); }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { color: var(--red); border-color: rgba(255,77,109,.3); }

/* Responsive */
@media(max-width: 768px) {
  .map-config { bottom: 20px; left: 10px; right: auto; width: calc(100vw - 60px); }
  .map-elev-badge { bottom: 120px; left: 10px; width: 240px; }
  .icon-btn { flex-shrink: 0; }
  .map-search-input { width: 210px; font-size: 10.5px; }
  .ac-dropdown { min-width: unset; max-width: calc(100vw - 20px); width: calc(100vw - 20px); right: 0; left: 0; }
}
</style>
</head>
<body>
<div class="map-wrap">
  <div id="map"></div>

  <div class="top-search-area" id="topSearchArea">
    <div class="search-row">
      <div class="search-wrap">
        <div class="floating-panel map-search">
          <input class="map-search-input" id="mapSearchInput" type="text"
            placeholder="Tìm địa danh hoặc nhập tọa độ..."
            autocomplete="off"
            oninput="onSearchInput(this.value)"
            onkeydown="onSearchKeydown(event)"
          >
          <div class="map-search-actions">
            <button class="map-search-btn clear-btn" id="btnClear" onclick="clearSearch()" title="Xóa">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <div class="btn-sep" id="btnSep"></div>
            <button class="map-search-btn search-btn" onclick="triggerSearch()" title="Tìm kiếm">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
          </div>
        </div>
        <div class="ac-dropdown" id="acDropdown"></div>
      </div>

      <button class="floating-panel icon-btn" id="btnPaste" onclick="doMapPaste()" title="Dán từ khay nhớ tạm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="4" rx="1.5"/>
          <path d="M16 4h1a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1"/>
          <path d="M9 12h6M9 16h4"/>
        </svg>
      </button>

      <button class="floating-panel icon-btn" id="mapGpsBtn" onclick="doGPS()" title="Vị trí của tôi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
          <circle cx="12" cy="12" r="8" opacity=".3"/>
        </svg>
      </button>
    </div>

    <div class="floating-panel map-presets" id="mapPresets">
      <button class="pre-btn" onclick="setCoords(12.2459,109.1945)">Nha Trang</button>
      <button class="pre-btn" onclick="setCoords(21.0285,105.8542)">Hà Nội</button>
      <button class="pre-btn" onclick="setCoords(20.8449,106.6881)">Hải Phòng</button>
      <button class="pre-btn" onclick="setCoords(16.0544,108.2022)">Đà Nẵng</button>
      <button class="pre-btn" onclick="setCoords(10.7769,106.7009)">TP. HCM</button>
    </div>
  </div>

  <div class="floating-panel map-layer-btns" id="mapLayerBtns">
    <button class="layer-btn" id="btnStreet" onclick="switchLayer('street',this)">Street</button>
    <button class="layer-btn active" id="btnSatellite" onclick="switchLayer('satellite',this)">Satellite</button>
    <button class="layer-btn" onclick="switchLayer('topo',this)">Topo</button>
    <button class="layer-btn label-btn on" id="btnLabels" onclick="toggleLabels(this)">Labels</button>
  </div>

  <div class="floating-panel map-config" id="mapConfig">
    <div class="cfg-row">
      <span class="cfg-label" id="srcLabelText">Nguồn:</span>
      <div class="cfg-pills">
        <button class="cfg-pill active" onclick="setSrc('open-meteo',this)">O-Meteo</button>
        <button class="cfg-pill" onclick="setSrc('open-elevation',this)">O-Elev</button>
      </div>
      <div class="cfg-divider"></div>
      <div class="mini-btn-group">
        <button class="theme-btn-mini lang-btn" id="langBtn" onclick="toggleLang()" title="Chuyển ngôn ngữ / Language">VI</button>
        <button class="theme-btn-mini" id="themeBtn" onclick="toggleTheme()" title="Đổi giao diện">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </div>
    <div class="cfg-row">
      <span class="cfg-label" id="dsLabelText">Dữ liệu:</span>
      <div class="cfg-pills">
        <button class="cfg-pill ds active" onclick="setDs('srtm30',this)">SRTM30</button>
        <button class="cfg-pill ds" onclick="setDs('srtm90',this)">SRTM90</button>
        <button class="cfg-pill ds" onclick="setDs('aster',this)">ASTER</button>
        <button class="cfg-pill ds" onclick="setDs('mapzen',this)">Mapzen</button>
      </div>
    </div>
  </div>

  <div class="floating-panel map-zoom-cluster" id="mapZoomCluster">
    <button class="map-zoom-btn" onclick="map.zoomIn()" title="Zoom In">+</button>
    <button class="map-zoom-btn" onclick="map.zoomOut()" title="Zoom Out">−</button>
  </div>

  <div class="floating-panel map-elev-badge" id="mapElevBadge">
    <div class="meb-spin"></div>
    <div class="meb-top">
      <div class="meb-numblock">
        <span class="meb-num" id="mapElevNum">—</span>
        <span class="meb-unit">m</span>
      </div>
      <div class="meb-info">
        <span class="meb-label" id="badgeDsLabel">Độ cao · SRTM30</span>
        <span class="meb-loc" id="mapElevLoc">Đang định vị...</span>
      </div>
    </div>
    <div class="meb-divider"></div>
    <div class="meb-terrain">
      <div class="meb-terrain-label">
        <span id="terrainLabelText">Địa hình</span>
        <span id="mapTerrainDesc">—</span>
      </div>
      <div class="meb-track">
        <div class="meb-thumb" id="mapTThumb"></div>
      </div>
      <div class="meb-ticks">
        <span id="tickSea">Biển</span>
        <span>500m</span>
        <span>1500m</span>
        <span>3000m+</span>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// --- MULTI-LANGUAGE SYSTEM ---
let currentLang = 'vi';

const LANG = {
  vi: {
    placeholder: "Tìm địa danh hoặc nhập tọa độ...",
    pasteMsg: "✓ Đã dán thành công",
    pasteTitle: "Dán từ khay nhớ tạm",
    gpsTitle: "Vị trí của tôi",
    lightMode: "☀ Giao diện sáng",
    darkMode: "🌙 Giao diện tối",
    lblSource: "Nguồn:",

  satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:''}),
  street:    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:''}),
  topo:      L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:''})
};

  'https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png',
  {maxZoom:19,opacity:1,subdomains:'abcd',className:'label-tile-invert'}
);

let _labelsOn = true;

function switchLayer(name, btn) {
  if (currentLayer) map.removeLayer(currentLayer);
  currentLayer = LAYERS[name];
  currentLayer.addTo(map);
  document.querySelectorAll('.layer-btn:not(.label-btn)').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const shouldLabel = (name === 'satellite');
  if (shouldLabel && !_labelsOn) {
    _labelsOn = true; LABEL_TILE.addTo(map);
    document.getElementById('btnLabels').classList.add('on');
  } else if (!shouldLabel && _labelsOn) {
    _labelsOn = false; map.removeLayer(LABEL_TILE);
    document.getElementById('btnLabels').classList.remove('on');
  } else if (_labelsOn) {
    map.removeLayer(LABEL_TILE); LABEL_TILE.addTo(map);
  }
}

function toggleLabels(btn) {
  _labelsOn = !_labelsOn;
  if (_labelsOn) { LABEL_TILE.addTo(map); btn.classList.add('on'); showToast(LANG[currentLang].labelsOn); }

function initMap() {
  updateLangUI(); // Init ngôn ngữ mặc định

  map = L.map('map',{zoomControl:false,attributionControl:false}).setView([_lat,_lon],13);
  currentLayer = LAYERS.satellite; 
  currentLayer.addTo(map);
  LABEL_TILE.addTo(map); 

  const mkIcon = () => L.divIcon({
    html:`<div style="width:18px;height:18px;background:#3dffa0;border:2.5px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 10px rgba(0,0,0,.6),0 0 0 3px rgba(61,255,160,.25)"></div>`,
    iconSize:[18,18],iconAnchor:[9,18],className:''
  });

  marker = L.marker([_lat,_lon],{icon:mkIcon(),draggable:true}).addTo(map);

  ['topSearchArea','mapPresets','mapLayerBtns','mapConfig','mapZoomCluster','mapElevBadge'].forEach(disableProp);

  marker.on('dragend', e => {
    const p = e.target.getLatLng();
    applyCoords(+p.lat.toFixed(6), +p.lng.toFixed(6), false, true);
  });
  map.on('click', e => {
    applyCoords(+e.latlng.lat.toFixed(6), +e.latlng.lng.toFixed(6), false, true);
  });
}

function applyCoords(lat, lon, moveMap=true, autoScan=false) {
  _lat=lat; _lon=lon;
  const v = lat+'° N, '+lon+'° E';
  _skipSearchInput = true;
  document.getElementById('mapSearchInput').value = v;
  _skipSearchInput = false;
  if(marker) marker.setLatLng([lat,lon]);
  if(map && moveMap) map.setView([lat,lon],map.getZoom());
  else if(map) map.panTo([lat,lon]);
  if(autoScan) doScan();
}

function doGPS() {
  if(!navigator.geolocation){ showToast(LANG[currentLang].noGps, true); return; }
  const mapBtn = document.getElementById('mapGpsBtn');
  mapBtn.classList.add('locating');
  navigator.geolocation.getCurrentPosition(
    pos=>{
      const lat = +pos.coords.latitude.toFixed(6);
      const lon = +pos.coords.longitude.toFixed(6);
      applyCoords(lat,lon,true);
      map.setView([lat,lon],15);
      mapBtn.classList.remove('locating');
      showToast(LANG[currentLang].gpsFound);
      doScan();
    },
    err=>{
      mapBtn.classList.remove('locating');
      showToast(LANG[currentLang].gpsErr, true);
    },
    {enableHighAccuracy:true,timeout:15000}
  );
}

function onInput(raw) {
  const nums = raw.replace(/[°′″'"]/g,' ').match(/-?\d+(?:\.\d+)?/g);
  if(!nums||nums.length<2) return false;
  let lat=parseFloat(nums[0]),lon=parseFloat(nums[1]);
  if(/S/i.test(raw)) lat=-Math.abs(lat);
  if(/W/i.test(raw)) lon=-Math.abs(lon);
  if(isNaN(lat)||isNaN(lon)||lat<-90||lat>90) return false;
  // Normalize longitude về [-180, 180] nếu Leaflet wrap qua 180°
  lon = ((lon + 180) % 360 + 360) % 360 - 180;
  _lat=lat; _lon=lon;
  if(marker){marker.setLatLng([lat,lon]);map.panTo([lat,lon]);}
  return true;
}

// --- AUTOCOMPLETE SYSTEM ---
let _acDebounce = null;
let _acResults = [];
let _acFocusIdx = -1;
let _acOpen = false;
let _acBlurTimer = null;

const TYPE_ICON = {
  city: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
  town: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
  village: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
  mountain: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 20 12 4 21 20 3 20"/></svg>`,
  peak: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 20 12 4 21 20 3 20"/></svg>`,
  water: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C6 2 2 8 2 12s3 8 10 8 10-4 10-8-4-10-10-10z"/></svg>`,
  default: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="3"/><path d="M12 2C7.03 2 3 6.03 3 11c0 5.25 7.5 11 9 11s9-5.75 9-11c0-4.97-4.03-9-9-9z"/></svg>`
};

function getTypeIcon(cls, type) {
  const s = (cls+' '+type).toLowerCase();
  if(s.includes('peak')||s.includes('mountain')||s.includes('núi')) return TYPE_ICON.mountain;
  if(s.includes('water')||s.includes('lake')||s.includes('river')||s.includes('bay')) return TYPE_ICON.water;
  if(s.includes('city')) return TYPE_ICON.city;
  if(s.includes('town')) return TYPE_ICON.town;
  if(s.includes('village')) return TYPE_ICON.village;
  return TYPE_ICON.default;
}

function getTypeLabel(cls, type) {
  const s = (cls+' '+type).toLowerCase();
  if(s.includes('city')) return 'Thành phố';
  if(s.includes('town')) return 'Thị trấn';
  if(s.includes('village')) return 'Làng/Xã';
  if(s.includes('peak')||s.includes('mountain')) return 'Núi/Đỉnh';
  if(s.includes('lake')) return 'Hồ';
  if(s.includes('river')) return 'Sông';
  if(s.includes('bay')||s.includes('sea')) return 'Vịnh/Biển';
  if(s.includes('administrative')) return 'Khu vực';
  if(s.includes('natural')) return 'Thiên nhiên';
  if(s.includes('tourism')) return 'Du lịch';
  if(s.includes('historic')) return 'Di tích';
  if(s.includes('amenity')) return 'Địa điểm';
  return cls || type || '';
}

function buildSubtitle(item) {
  const a = item.address || {};
  const parts = [];
  const city = a.city || a.town || a.county || a.state_district;
  const state = a.state || a.province;
  const country = a.country;
  if(city && city !== item.name) parts.push(city);
  if(state && state !== city && state !== item.name) parts.push(state);
  if(country) parts.push(country);
  return parts.join(', ') || item.display_name || '';
}

function acShowLoading() {
  const dd = document.getElementById('acDropdown');
  dd.innerHTML = `<div class="ac-loading"><div class="ac-loading-dot"></div><div class="ac-loading-dot"></div><div class="ac-loading-dot"></div></div>`;
  dd.classList.add('open');
  _acOpen = true;
}

function acShowEmpty(msg) {
  const dd = document.getElementById('acDropdown');
  dd.innerHTML = `<div class="ac-empty">${msg}</div>`;
  dd.classList.add('open');
  _acOpen = true;
}

function acClose() {
  const dd = document.getElementById('acDropdown');
  dd.classList.remove('open');
  _acOpen = false;
  _acFocusIdx = -1;
}

function acRender(results) {
  _acResults = results;
  _acFocusIdx = -1;
  const dd = document.getElementById('acDropdown');
  if(!results.length) { acShowEmpty(currentLang==='vi'?'Không tìm thấy địa danh':'No places found'); return; }
  dd.innerHTML = results.map((r,i) => {
    const icon = getTypeIcon(r.class||'', r.type||'');
    const typeLabel = getTypeLabel(r.class||'', r.type||'');
    const name = r.name || r.display_name.split(',')[0];
    const sub = buildSubtitle(r);
    return `<div class="ac-item" data-idx="${i}" onmousedown="acSelect(${i})">
      <div class="ac-icon">${icon}</div>
      <div class="ac-text">
        <div class="ac-name">${escHtml(name)}</div>
        ${sub ? `<div class="ac-sub">${escHtml(sub)}</div>` : ''}
      </div>
      ${typeLabel ? `<div class="ac-type">${escHtml(typeLabel)}</div>` : ''}
    </div>`;
  }).join('');
  dd.classList.add('open');
  _acOpen = true;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let _skipSearchInput = false;

function acSelect(idx) {
  const r = _acResults[idx];
  if(!r) return;
  const lat = parseFloat(r.lat), lon = parseFloat(r.lon);
  const name = r.name || r.display_name.split(',')[0];
  _skipSearchInput = true;
  document.getElementById('mapSearchInput').value = name;
  _skipSearchInput = false;
  acClose();
  applyCoords(lat, lon, true, true);
  if(r.boundingbox) {
    try {
      const bb = r.boundingbox;
      map.fitBounds([[+bb[0],+bb[2]],[+bb[1],+bb[3]]], {maxZoom:15});
    } catch(e) { map.setView([lat,lon], 14); }
  } else {
    map.setView([lat,lon], 14);
  }
}

function acMoveFocus(dir) {
  const items = document.querySelectorAll('#acDropdown .ac-item');
  if(!items.length) return;
  items.forEach(el => el.classList.remove('focused'));
  _acFocusIdx = Math.max(0, Math.min(items.length-1, _acFocusIdx + dir));
  items[_acFocusIdx].classList.add('focused');
  items[_acFocusIdx].scrollIntoView({block:'nearest'});
}

let _acAbort = null;
let _acCurrentQuery = '';

async function acSearch(q) {
  // Hủy request cũ nếu còn đang chạy
  if(_acAbort) { _acAbort.abort(); }
  _acAbort = new AbortController();
  try {
    const lang = currentLang === 'vi' ? 'vi' : 'en';
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&addressdetails=1&limit=6&accept-language=${lang}`;
    const r = await fetch(url, {
      headers:{'User-Agent':'ElevationScannerApp/1.0'},
      signal: _acAbort.signal
    });
    if(!r.ok) throw new Error('fetch fail');
    const data = await r.json();
    _acAbort = null;
    return data;
  } catch(e) {
    if(e.name === 'AbortError') return 'aborted';
    return null;
  }
}

function onSearchInput(val) {
  if(_skipSearchInput) return;
  clearTimeout(_acDebounce);
  if(_acAbort) { _acAbort.abort(); _acAbort = null; }

  // Try coordinate parse first
  const isCoord = onInput(val);
  if(isCoord) { acClose(); _acResults = []; return; }
  
  const q = val.trim();
  _acCurrentQuery = q;
  if(q.length < 2) { acClose(); _acResults = []; return; }
  
  acShowLoading();
  _acDebounce = setTimeout(async () => {
    const results = await acSearch(q);
    if(results === 'aborted') return; // request cũ bị hủy, bỏ qua
    if(results === null) { acShowEmpty(currentLang==='vi'?'Lỗi kết nối':'Connection error'); return; }
    acRender(results);
  }, 320);
}

async function triggerSearch() {
  const val = document.getElementById('mapSearchInput').value.trim();
  if(!val) return;
  // Tọa độ → scan luôn
  if(onInput(val)) { acClose(); _acResults = []; doScan(); return; }
  // Hủy debounce và request đang pending
  clearTimeout(_acDebounce);
  if(_acAbort) { _acAbort.abort(); _acAbort = null; }
  acClose();
  // Search và nhảy thẳng kết quả đầu tiên
  const results = await acSearch(val);
  if(results && results !== 'aborted' && results.length) {
    _acResults = results;
    acSelect(0);
  }
  // Không có kết quả → không làm gì (giữ nguyên vị trí)
}

function onSearchKeydown(e) {
  if(e.key === 'Escape') { acClose(); return; }
  if(e.key === 'ArrowDown') { e.preventDefault(); acMoveFocus(1); return; }
  if(e.key === 'ArrowUp')   { e.preventDefault(); acMoveFocus(-1); return; }
  if(e.key === 'Enter') {
    e.preventDefault();
    if(_acFocusIdx >= 0 && _acResults.length) { acSelect(_acFocusIdx); return; }
    triggerSearch();
  }
}

function clearSearch() {
  clearTimeout(_acDebounce);

  _acResults = [];
  _acCurrentQuery = '';
  const inp = document.getElementById('mapSearchInput');

function showToast(msg, isErr=false){
  const el = document.getElementById('toast');
  el.textContent = msg; 
  el.className = 'toast on' + (isErr ? ' err' : '');
  setTimeout(()=>el.classList.remove('on'), 2500);

function terrain(e){
  if(e<0)   return{idx:0,p:0};
  if(e<10)  return{idx:1,p:2};
  if(e<50)  return{idx:2,p:7};
  if(e<200) return{idx:3,p:16};
  if(e<500) return{idx:4,p:28};
  if(e<1000)return{idx:5,p:44};
  if(e<1500)return{idx:6,p:57};
  if(e<2000)return{idx:7,p:69};
  if(e<3000)return{idx:8,p:83};
  return    {idx:9,p:96};
}

async function fetchFromOpenElevation(lat,lon){
  const r=await fetch(`https://api.open-elevation.com/api/v1/lookup`,{
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify({locations:[{latitude:lat,longitude:lon}]}),
    signal:AbortSignal.timeout(10000)
  });
  if(!r.ok) throw new Error('API Error '+r.status);
  const d=await r.json();
  if(d.results?.[0]==null) throw new Error('No data found');
  return{elevation:d.results[0].elevation};
}

async function fetchFromOpenMeteo(lat,lon){
  const r=await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lon}`,{signal:AbortSignal.timeout(9000)});
  if(!r.ok) throw new Error('API Error '+r.status);
  const d=await r.json();
  const v=Array.isArray(d.elevation)?d.elevation[0]:d.elevation;
  if(v==null) throw new Error('No data found');
  return{elevation:v};
}

async function fetchElev(lat,lon){
  if(_src==='open-elevation') return await fetchFromOpenElevation(lat,lon);
  return fetchFromOpenMeteo(lat,lon);
}

async function fetchLoc(lat,lon){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=${currentLang}`,
      {headers:{'User-Agent':'NASAElevationApp/1.0'},signal:AbortSignal.timeout(7000)});
    if(!r.ok) return null;
    const d=await r.json();
    const a=d.address||{};
    const parts=[];
    const local=a.village||a.hamlet||a.suburb||a.neighbourhood||a.town||a.city_district;
    const dist=a.county||a.district||a.city;
    const prov=a.state||a.province;
    if(local) parts.push(local);
    if(dist&&dist!==local) parts.push(dist);
    if(prov&&prov!==dist) parts.push(prov);
    if(a.country) parts.push(a.country);
    return parts.length ? parts.join(', ') : d.display_name;
  }catch(e){return null;}
}

async function doScan(){
  const badge = document.getElementById('mapElevBadge');
  badge.classList.add('show','loading');
  document.getElementById('mapElevLoc').textContent = LANG[currentLang].locating;

  try{
    const data=await fetchElev(_lat,_lon);
    const elev=Math.round(data.elevation*10)/10;
    const t=terrain(elev);

    document.getElementById('mapElevNum').textContent = elev.toLocaleString('en-US');
    document.getElementById('mapTerrainDesc').textContent = LANG[currentLang].t[t.idx];
    setTimeout(()=>document.getElementById('mapTThumb').style.left=t.p+'%',300);
    badge.classList.remove('loading');

    fetchLoc(_lat,_lon).then(name=>{
      document.getElementById('mapElevLoc').textContent = name || LANG[currentLang].unknown;
    });
  }catch(e){
    showToast(LANG[currentLang].errApi, true);
    badge.classList.remove('loading');
    document.getElementById('mapElevLoc').textContent = LANG[currentLang].errApi;
  }
}

window.addEventListener('load',()=>{
  initMap();
  setTimeout(doScan,400);
